<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Athena 猫头鹰 logo v5: 圆润萌系 + 智慧眼镜 (契合 Athena 智慧女神) -->
  
  <!-- 身体 (胖乎乎圆球, 橙色) -->
  <path d="M32 14 
           Q44 14 44 28 
           Q44 46 32 54 
           Q20 46 20 28 
           Q20 14 32 14 Z" fill="#ff6633"/>
  
  <!-- 耳羽簇 (柔和圆润, 贴合头部, 深蓝) -->
  <path d="M24 15 Q24 9 28 7 Q27.5 12 27.5 16 Z" fill="#2d3142"/>
  <path d="M40 15 Q40 9 36 7 Q36.5 12 36.5 16 Z" fill="#2d3142"/>
  
  <!-- 脸部圆盘 (天空蓝) -->
  <ellipse cx="26" cy="27" rx="7" ry="7.5" fill="#69b3e7"/>
  <ellipse cx="38" cy="27" rx="7" ry="7.5" fill="#69b3e7"/>
  
  <!-- 大眼睛 (白底 + 深蓝瞳孔 + 水汪汪高光) -->
  <circle cx="26" cy="27" r="4.4" fill="#ffffff"/>
  <circle cx="38" cy="27" r="4.4" fill="#ffffff"/>
  <circle cx="26.8" cy="27.3" r="2.3" fill="#2d3142"/>
  <circle cx="37.2" cy="27.3" r="2.3" fill="#2d3142"/>
  <circle cx="27.5" cy="26" r="1.2" fill="#ffffff"/>
  <circle cx="37.9" cy="26" r="1.2" fill="#ffffff"/>
  
  <!-- 智慧细边眼镜 (深蓝, 契合 Athena 智慧) -->
  <circle cx="26" cy="27" r="5.6" fill="none" stroke="#2d3142" stroke-width="1.1"/>
  <circle cx="38" cy="27" r="5.6" fill="none" stroke="#2d3142" stroke-width="1.1"/>
  <path d="M31.6 27 Q32 28.5 32.4 27" stroke="#2d3142" stroke-width="1.1" fill="none"/>
  
  <!-- 喙 (深蓝圆润小三角) -->
  <path d="M30.8 30 Q32 34 33.2 30 Q32 28.5 30.8 30 Z" fill="#2d3142"/>
  
  <!-- 翅膀 (两侧浅橙小弧) -->
  <path d="M21 34 Q17 40 20 46" stroke="#e65a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M43 34 Q47 40 44 46" stroke="#e65a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 胸腹 V 形羽毛 (浅橙) -->
  <path d="M28 40 L32 44 L36 40" stroke="#e65a2b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  
  <!-- 小脚 (深蓝) -->
  <ellipse cx="28.5" cy="53" rx="2.2" ry="1.4" fill="#2d3142"/>
  <ellipse cx="35.5" cy="53" rx="2.2" ry="1.4" fill="#2d3142"/>
</svg>
